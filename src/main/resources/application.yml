spring:
  application:
    name: teamflow

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dGVhbWZsb3ctc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
  expiration: ${JWT_EXPIRATION:86400000}
